services:
  app:
    build: .
    container_name: banking-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # DATABASE_URL vem do shell do host (${DATABASE_URL}). Exporte antes de
      # subir: export DATABASE_URL='mysql://user:senha@host:3306/Banking'
      # Aspas simples preservam o "$" da senha.
      DATABASE_URL: "${DATABASE_URL}"
    ports:
      # Publicado na porta 3100 (host) por segurança; internamente o app
      # continua na 3000. Mapeamento: HOST:CONTAINER.
      - "3100:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
