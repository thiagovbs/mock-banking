services:
  - type: web
    name: banking-api
    runtime: node
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run db:deploy && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
